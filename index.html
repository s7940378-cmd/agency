function buildTerrain() {

    const a = rng.range(0, TAU), d = Math.sqrt(rng.next()) * 560, x = Math.cos(a) * d, z = Math.sin(a) * d;
    const r = rng.range(28, 75), h = rng.range(5, 18) * (r / 55);
    if (shoreDist(x, z) < r + 25) continue;
    if (POIS.some(p => hyp(p.x - x, p.z - z) < p.r + r + 25)) continue;
    if (hyp((x - LAKE.x) / 1.3, z - LAKE.z) < LAKE.rx + r + 15) continue;
    let bad = false;
    for (let i = 0; i < RIVER.length - 1; i++) if (segDist(x, z, RIVER[i][0], RIVER[i][1], RIVER[i + 1][0], RIVER[i + 1][1]) < r + 18) bad = true;
    if (bad) continue;
    W.hills.push({ x, z, r, h });
  }
  for (let iz = 0; iz < HN; iz++) for (let ix = 0; ix < HN; ix++) {
    const x = ix * HC - HE, z = iz * HC - HE;
    const sd = shoreDist(x, z);
    let h;
    if (sd < 0) h = Math.max(-9, -1.2 + sd * 0.12);
    else if (sd < 28) h = lerp(-1.2, 1.6, smooth(sd / 28));
    else h = 1.6 + (n1(x / 90, z / 90) - 0.5) * 2.2 + (n2(x / 23, z / 23) - 0.5) * 0.5;
    // towns are flat
    for (const p of POIS) {
      const d = hyp(p.x - x, p.z - z);
      if (d < p.r + 30) h = lerp(1.6, h, smooth(clamp((d - p.r) / 30, 0, 1)));
    }
    for (const hl of W.hills) {
      const d = hyp(hl.x - x, hl.z - z) / hl.r;
      if (d < 1) h += hl.h * (0.5 + 0.5 * Math.cos(d * Math.PI));
    }

function carveRiver() {

function moveFighter(f, mx, mz, dt) {

    const sh = supportH(nx, nz, f.y + step);

// ---------------------------------------------------------------- shooting
// distance from ray to fighter capsule; returns t or null and head flag
function rayFighters(ox, oy, oz, dx, dy, dz, maxT, shooter) {

    const along = fx * dx + fz * dz; // horizontal projection (dx,dz not normalized horizontally)

    const dd = (px - f.x) ** 2 + (pz - f.z) ** 2;

    if (dd > rad * rad) continue;

function sfx(name, vol, pan) {

function playAt(name, x, y, z, mine) {

      sig.on('EXPIRE', () => fail('nohost'));
      dc.onopen = () => { clearTimeout(to); res(); };

    room.attach(hostId, dc);

};
// =====================================================================
//  Boot + main loop
// =====================================================================
let lastT = 0, fpsAcc = 0, fpsN = 0, fpsTimer = 0, wasAlive = true, wasOver = false;
function resizeGL() {
  const c = document.getElementById('gl');
  const w = Math.max(1, Math.round(c.clientWidth * App.scale)), h = Math.max(1, Math.round(c.clientHeight * App.scale));
  if (c.width !== w || c.height !== h) { c.width = w; c.height = h; }
}
function frame(ts) {
  requestAnimationFrame(frame);
  const dt = clamp((ts - lastT) / 1000, 0, 0.05); lastT = ts;
  const t = ts / 1000;
  try {
    if (App.state === 'match' && G) {
      updateCamera(dt);
      if (!(App.paused && !G.net)) updateMatch(dt);
      if (G) {
        if (wasAlive !== G.me.alive || wasOver !== G.over) { wasAlive = G.me.alive; wasOver = G.over; matchUI(); }
      }
    } else {
      // lobby fly-around
      const a = t * 0.04;
      Cam.eye = [Math.sin(a) * 300, 95, Math.cos(a) * 300];
      const tx = Math.sin(a + 0.6) * 60, tz = Math.cos(a + 0.6) * 60;
      const dx = tx - Cam.eye[0], dy = 10 - Cam.eye[1], dz = tz - Cam.eye[2], l = Math.hypot(dx, dy, dz);
      Cam.fwd = [dx / l, dy / l, dz / l]; Cam.fov = 60;
    }
    Input.dx = Input.dy = 0; Input.pressed.clear(); Input.wheel = 0;
    resizeGL();
    renderScene(t, App.state === 'match' ? App.quality : Object.assign({}, App.quality, { far: 1100 }));
    drawHud(dt, t);
    updateAudio();
  } catch (e) { console.error(e); }
  // automatic resolution for slower laptops
  fpsAcc += dt; fpsN++; fpsTimer += dt;
  if (fpsTimer > 1.2) {
    const avg = fpsAcc / fpsN; App.fps = 1 / avg;
    if (App.quality.dyn && App.state === 'match') {
      if (avg > 0.024 && App.scale > 0.5) App.scale = Math.max(0.5, App.scale - 0.07);
      else if (avg < 0.0155 && App.scale < 1.0) App.scale = Math.min(1.0, App.scale + 0.05);
    }

}
function boot() {

    return;
  }
  hud = document.getElementById('hud'); hctx = hud.getContext('2d');
  loadSave();
  App.quality = QUALITY[App.save.quality] || QUALITY.AUTO; App.scale = App.quality.scale; Cam.sens = App.save.sens; AU.vol = App.save.vol;
  buildWorld();
  indexBushes();
  buildScene();
  buildMapImage();

  window.addEventListener('resize', resizeHud);

setUI($(`<div class="center"><div class="menu"><h2>OPERATION: AGENCY</h2><div class="note" style="text-align:center">Building the island...</div></div></div>`));
setTimeout(boot, 30);
</script>
