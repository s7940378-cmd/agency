<style>
/* Layout: one full-screen game surface; menus float over it as panels. Single dark look on purpose. */
:root{
  --ink:#0b0d1c;          /* night-navy base */
  --panel:#12152b;        /* menu panels */
  --panel-2:#1b2042;
  --line:#2c3363;
  --text:#eef0ff;
  --muted:#9aa3d6;
  --gold:#ffd83a;         /* agency gold / primary action */
  --gold-2:#ffe979;
  --red:#ff5a4f;
  --green:#7be38b;
  --blue:#5bc8ff;
  --display:"Black Ops One","Impact","Arial Narrow Bold",sans-serif;
  --body:"Barlow Condensed","Arial Narrow","Roboto Condensed",Arial,sans-serif;
  color-scheme:dark;
}
html,body{height:100%;background:var(--ink);color:var(--text);overflow:hidden}
body{font-family:var(--body);font-size:18px;user-select:none;-webkit-user-select:none}
#wrap{position:fixed;inset:0;background:var(--ink)}
#gl,#hud{position:absolute;inset:0;width:100%;height:100%;display:block}
#hud{pointer-events:none}
#ui{position:absolute;inset:0;pointer-events:none}
#ui>*{pointer-events:auto}
button{font-family:var(--body);font-weight:800;letter-spacing:.04em;cursor:pointer;border:0;border-radius:6px;color:var(--text);background:var(--panel-2);padding:.55em 1.1em;font-size:1rem}
button:hover{filter:brightness(1.18)}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
button.primary{background:var(--gold);color:#16120a}
button.primary:hover{background:var(--gold-2)}
button:disabled{opacity:.45;cursor:default;filter:none}
input[type=text]{font-family:var(--body);font-size:1.1rem;font-weight:700;background:#080a17;color:var(--text);border:2px solid var(--line);border-radius:6px;padding:.45em .7em;width:100%}

/* ---- lobby ---- */
.lobby{position:absolute;inset:0;display:grid;grid-template-columns:minmax(0,340px) 1fr minmax(0,340px);grid-template-rows:auto 1fr auto;gap:16px;
  padding-block:16px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  background:radial-gradient(ellipse at 50% 38%,rgba(70,60,160,.35),transparent 60%),linear-gradient(180deg,rgba(11,13,28,.25),rgba(11,13,28,.85))}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:18px;flex-wrap:wrap}
.logo{font-family:var(--display);line-height:.9;color:var(--gold);font-size:2.1rem;text-shadow:0 3px 0 #3a2d00}
.logo small{display:block;font-size:.9rem;color:var(--text);letter-spacing:.2em}
.tabs{display:flex;gap:6px;flex-wrap:wrap}
.tabs button{background:transparent;font-size:1.25rem;font-style:italic;color:var(--muted)}
.tabs button.on{color:var(--text);box-shadow:inset 0 -3px 0 var(--gold)}
.lvl{margin-left:auto;display:flex;align-items:center;gap:10px;font-weight:800}
.lvl .bar{width:120px;height:8px;background:#2a2f58;border-radius:4px;overflow:hidden}
.lvl .bar i{display:block;height:100%;background:var(--blue)}
.coins{color:var(--gold);font-weight:900;white-space:nowrap}
.acct{padding:6px 12px;font-size:.85rem;white-space:nowrap;max-width:160px;overflow:hidden;text-overflow:ellipsis}
.fcol{display:flex;flex-direction:column;gap:4px}
.col>.card{flex-shrink:0}
.rrow{display:flex;justify-content:space-between;gap:10px;padding:6px 0;border-bottom:1px solid #2a2f58}.rrow b{color:var(--gold)}
.fcol input[type=text],.fcol input[type=password]{font:inherit;font-size:1.05rem;padding:9px 10px;border-radius:8px;border:2px solid #3a4180;background:#141836;color:#fff}
.daily{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0}
.dday{background:#1b2048;border:2px solid #2d3470;border-radius:8px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;gap:2px;font-size:.8rem}
.dday b{font-size:1.4rem}.dday span{font-weight:800;color:var(--gold)}
.dday.got{opacity:.55;border-color:#3d8b4f}.dday.now{border-color:var(--gold);box-shadow:0 0 12px rgba(255,200,60,.5);opacity:1}
.daily.small .dday b{font-size:1.1rem}
.quest{background:#1b2048;border-radius:8px;padding:8px 10px;margin:6px 0}
.quest .qtop{display:flex;justify-content:space-between;gap:10px;font-weight:700}
.quest .qbar{height:7px;background:#2a2f58;border-radius:4px;overflow:hidden;margin:6px 0 3px}
.quest .qbar i{display:block;height:100%;background:var(--gold)}
.quest.done{opacity:.6}.quest.done .qbar i{background:#4fd06a}
.quest small{color:#aab}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:10px;margin-top:8px}
.sitem{background:#1b2048;border-radius:10px;padding:8px;display:flex;flex-direction:column;gap:6px;align-items:stretch;text-align:center}
.sart{height:110px;border-radius:8px;background:radial-gradient(circle at 50% 35%,#3a4290,#1b2048 70%);overflow:hidden}
.card{background:rgba(18,21,43,.88);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card h3{margin:0;font-style:italic;font-weight:800;font-size:1.3rem;letter-spacing:.03em}
.col{display:flex;flex-direction:column;gap:14px;min-width:0;overflow:auto}
.muted{color:var(--muted)}
.stage{position:relative;min-height:0}
.playbox{display:flex;flex-direction:column;gap:10px;align-items:stretch}
.playbtn{font-family:var(--display);font-size:3rem;padding:.25em .5em;background:var(--gold);color:#16120a;border-radius:10px;box-shadow:0 6px 0 #8a6d00}
.playbtn:active{transform:translateY(3px);box-shadow:0 3px 0 #8a6d00}
.mode{display:flex;gap:6px}
.mode button{flex:1}
.mode4 button{padding-left:4px;padding-right:4px;font-size:.85rem;white-space:nowrap}
.mode button.on{background:var(--gold);color:#16120a}
.member{display:flex;align-items:center;gap:10px;padding:8px 10px;background:var(--panel-2);border-radius:8px}

.member b{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.code{font-family:var(--display);font-size:1.6rem;letter-spacing:.08em;color:var(--gold)}
.linkbox{font-size:.85rem;word-break:break-all;background:#080a17;border:1px dashed var(--line);border-radius:6px;padding:8px;user-select:text;-webkit-user-select:text}
.row{display:flex;gap:8px;flex-wrap:wrap}
.binds{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:6px}
.bind{display:flex;justify-content:space-between;align-items:center;gap:8px;text-align:left;font-size:.85rem;padding:7px 10px}
.bind b{color:var(--gold);white-space:nowrap}
.bind.on{border-color:var(--gold);background:#2a2440}
.swatches{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sw{height:64px;border-radius:8px;border:3px solid transparent;display:flex;align-items:flex-end;justify-content:center;font-weight:800;font-size:.85rem;padding-bottom:4px;text-shadow:0 1px 2px #000}
.sw.on{border-color:var(--gold)}
.sw.locked{opacity:.4}
.cattabs{margin:4px 0 10px;flex-wrap:wrap;gap:4px}.cattabs button{flex:1 1 auto;padding:6px 6px;font-size:.72rem;white-space:nowrap}
.lockgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:8px;max-height:52vh;overflow:auto;padding:2px}
.lk{position:relative;background:#1b2048;border:3px solid transparent;border-radius:10px;cursor:pointer;display:flex;flex-direction:column;align-items:center;padding:4px 2px;gap:2px;font-weight:800;font-size:.72rem;text-align:center}
.lk img{width:100%;max-width:84px;aspect-ratio:3/4;object-fit:contain;background:radial-gradient(circle at 50% 35%,#3a4290,#1b2048 70%);border-radius:6px}
.lk.on{border-color:var(--gold)}.lk.locked{opacity:.45}
.lk.emo b{font-size:2.2rem;line-height:1.4;padding:6px 0}.lk.emo i{position:absolute;top:4px;right:6px;color:var(--gold);font-style:normal}
.sart img{width:100%;height:100%;object-fit:contain}
.emoart{display:flex;align-items:center;justify-content:center;height:100%;font-size:2.6rem}
.sitem small{font-size:.7rem}
.wheel{position:relative;width:360px;height:360px;border-radius:50%;background:radial-gradient(circle,rgba(20,24,60,.85) 30%,rgba(20,24,60,.6) 70%,transparent 72%)}
.wslot{position:absolute;width:96px;height:96px;border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:0;background:#232a66;border:3px solid #3a4290;font-size:.7rem}
.wslot:hover{border-color:var(--gold);transform:scale(1.08)}
.wslot b{font-size:2rem;line-height:1.1}.wslot i{position:absolute;top:2px;right:12px;font-style:normal;color:#aab}
.whub{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;font-weight:900;color:var(--gold);display:flex;flex-direction:column;gap:4px}.whub small{color:#aab;font-size:.65rem}
.note{font-size:.95rem;line-height:1.3;color:var(--muted)}
.foot{grid-column:1/-1;display:flex;gap:16px;align-items:center;flex-wrap:wrap;color:var(--muted);font-weight:700}
.toast{position:absolute;left:50%;top:14%;transform:translateX(-50%);background:rgba(0,0,0,.75);padding:10px 18px;border-radius:8px;font-weight:800;font-size:1.2rem;color:var(--gold);pointer-events:none;text-align:center;max-width:90%}
/* ---- overlays in match ---- */
.center{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(5,6,14,.6);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.menu{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:22px;display:flex;flex-direction:column;gap:12px;width:min(420px,100%)}
.menu h2{margin:0;font-family:var(--display);color:var(--gold);font-size:2.2rem;text-align:center}
.results{width:min(720px,100%)}
.results .place{font-family:var(--display);font-size:4rem;color:var(--gold);text-align:center;line-height:1}
.stats{display:grid;grid-template-columns:1fr auto;gap:6px 18px;font-size:1.15rem}
.stats span:nth-child(even){text-align:right;font-weight:800;font-variant-numeric:tabular-nums}
/* ---- inventory (Tab) ---- */
.finv{position:absolute;inset:0;display:flex;flex-direction:column;background:linear-gradient(180deg,rgba(8,24,72,.88),rgba(4,10,34,.94) 60%,rgba(3,6,20,.97));
  padding:14px max(16px,env(safe-area-inset-left,0px)) 18px;gap:14px;overflow:auto}
.finv.open{animation:finvIn .14s ease-out}
@keyframes finvIn{from{opacity:0;transform:scale(1.02)}to{opacity:1;transform:none}}
.ftop{display:flex;justify-content:space-between;align-items:center;border-bottom:2px solid rgba(120,170,255,.25);padding-bottom:10px}
.ftabs span{font-family:var(--display);font-size:1.7rem;letter-spacing:.04em;color:#fff;padding:2px 14px 8px;border-bottom:4px solid var(--gold)}
.fclose{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.25);color:#fff;font-weight:800;padding:6px 12px;border-radius:6px}
.fclose kbd{background:#fff;color:#0b1430;border-radius:4px;padding:1px 6px;margin-left:6px;font-family:var(--body);font-weight:900}
.fbody{flex:1;display:grid;grid-template-columns:minmax(0,1.25fr) minmax(260px,.75fr);gap:22px;min-height:0}
.fleft,.fright{min-width:0}
.fdetail{display:grid;grid-template-columns:minmax(150px,240px) 1fr;grid-template-rows:auto auto auto 1fr auto;column-gap:22px;row-gap:6px;align-items:start}
.fdetail.none{display:block;opacity:.7}
.fdart{grid-row:1/6;aspect-ratio:1;border-radius:6px;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(circle at 50% 35%,color-mix(in srgb,var(--rc) 75%,#fff 10%),color-mix(in srgb,var(--rc) 45%,#000) 75%);box-shadow:0 0 0 2px rgba(255,255,255,.15) inset,0 10px 30px rgba(0,0,0,.4)}
.fdart img{width:88%;image-rendering:auto;filter:drop-shadow(0 6px 6px rgba(0,0,0,.45))}
.fdrar{font-weight:900;letter-spacing:.12em;font-size:.9rem;color:var(--rc);display:flex;align-items:center;gap:8px}
.fdrar::before{content:"";width:28px;height:4px;background:var(--rc);border-radius:2px}
.fdname{font-family:var(--display);font-size:clamp(1.6rem,3.4vw,2.6rem);line-height:1;color:#fff;text-transform:uppercase}
.fddesc{color:#b9c6ef;font-size:.98rem}
.fstats{display:flex;flex-direction:column;gap:2px;margin-top:6px}
.fstat{display:flex;justify-content:space-between;padding:6px 10px;background:rgba(255,255,255,.05);border-left:3px solid var(--rc);font-weight:700}
.fstat b{font-variant-numeric:tabular-nums}
.fdbtns{display:flex;gap:8px;margin-top:8px}.fdbtns button{flex:1}
.fhead{font-family:var(--display);font-size:1.15rem;color:#9fc0ff;letter-spacing:.06em;margin:4px 0 8px}
.fmats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.fmat{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:6px;padding:10px 8px;display:flex;flex-direction:column;align-items:center;gap:4px}
.fmat i{width:34px;height:34px;border-radius:5px;transform:rotate(45deg) scale(.8);box-shadow:inset 0 -6px 0 rgba(0,0,0,.25)}
.fmat b{font-family:var(--display);font-size:1.5rem;color:#fff;line-height:1}
.fmat span{font-size:.8rem;color:#9fb0dd;font-weight:700}
.fmat button,.farow button{font-size:.7rem;padding:3px 8px}
.fammo{display:flex;flex-direction:column;gap:4px}
.farow{display:grid;grid-template-columns:auto 1fr auto auto;gap:10px;align-items:center;padding:7px 10px;background:rgba(255,255,255,.05);border-radius:5px;font-weight:700}
.farow i{width:10px;height:22px;border-radius:5px 5px 2px 2px}
.farow b{font-family:var(--display);font-size:1.2rem;min-width:3ch;text-align:right}
.farow.zero{opacity:.5}
.fbottom{display:flex;flex-direction:column;align-items:center;gap:8px}
.fhint{color:#8fa3d6;font-size:.85rem;font-weight:700}
.frow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.ftile{position:relative;width:clamp(64px,8.5vw,96px);aspect-ratio:1;border-radius:6px;cursor:grab;overflow:hidden;
  background:linear-gradient(180deg,color-mix(in srgb,var(--rc,#2a3360) 85%,#fff 8%),color-mix(in srgb,var(--rc,#2a3360) 40%,#05081a));
  box-shadow:inset 0 0 0 2px rgba(255,255,255,.18);transition:transform .08s}
.ftile:hover{transform:translateY(-3px)}
.ftile img{position:absolute;inset:8%;width:84%;height:84%;object-fit:contain;filter:drop-shadow(0 3px 3px rgba(0,0,0,.5));pointer-events:none}
.ftile.empty{background:rgba(255,255,255,.05);box-shadow:inset 0 0 0 2px rgba(255,255,255,.12);cursor:default}
.ftile.pick{box-shadow:inset 0 0 0 3px #fff,0 0 0 3px var(--gold)}

.ftile.over{transform:scale(1.06);box-shadow:inset 0 0 0 3px var(--gold)}
.ftile.drag{opacity:.35}
.fnum{position:absolute;left:5px;bottom:3px;font-weight:900;font-size:.75rem;color:rgba(255,255,255,.8);z-index:1}
.fcnt{position:absolute;right:6px;bottom:3px;font-family:var(--display);font-size:1rem;color:#fff;text-shadow:0 1px 2px #000;z-index:1}
.fbar{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--rc,transparent)}
.ftile.pickaxe{--rc:#3a4a7a;cursor:default}
.fpick{position:absolute;left:50%;top:50%;width:10%;height:62%;background:#8a5a30;transform:translate(-50%,-50%) rotate(-40deg);border-radius:2px}

.ftile.bin{--rc:#5a1f28;cursor:default;display:flex;align-items:center;justify-content:center;border:2px dashed #ff8a7a;box-shadow:none}
.ftile.bin span{font-weight:900;color:#ffb0a6;font-size:.8rem;letter-spacing:.08em}

.clicktoplay{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);background:rgba(0,0,0,.7);padding:12px 20px;border-radius:8px;font-weight:800;font-size:1.3rem}
.settings label{display:flex;justify-content:space-between;align-items:center;gap:10px;font-weight:700}
.settings select{font-family:var(--body);font-size:1rem;font-weight:700;background:#080a17;color:var(--text);border:2px solid var(--line);border-radius:6px;padding:4px 8px}
.lobby.wide #left{grid-column:1/3}.lobby.wide .stage{display:none}
.shopcard{background:linear-gradient(180deg,rgba(30,36,84,.96),rgba(17,20,46,.96))}
.shophead{display:flex;align-items:flex-end;justify-content:space-between;gap:10px;flex-wrap:wrap}
.shophead .reset{display:flex;flex-direction:column;align-items:flex-end;font-weight:800;font-size:.8rem;letter-spacing:.04em}

.shop.featured{grid-template-columns:repeat(auto-fill,minmax(170px,1fr))}
.sitem{position:relative;border:2px solid transparent;transition:transform .15s}.sitem:hover{transform:translateY(-2px)}

layout(location=1) in vec3 aNrm;
layout(location=2) in vec3 aCol;

layout(location=4) in vec4 aM1;

uniform vec3 uFogCol;
out vec4 o;

const HC = 4, HE = 720, HN = Math.round(HE * 2 / HC) + 1;   // height grid
const HGT = new Float32Array(HN * HN);
const WATER_Y = 0;

function groundH(x, z) {
  const gx = (x + HE) / HC, gz = (z + HE) / HC;
  let ix = Math.floor(gx), iz = Math.floor(gz);
  if (ix < 0 || iz < 0 || ix >= HN - 1 || iz >= HN - 1) return -6;
  const fx = gx - ix, fz = gz - iz, i = iz * HN + ix;
  return lerp(lerp(HGT[i], HGT[i + 1], fx), lerp(HGT[i + HN], HGT[i + HN + 1], fx), fz);
}
function onLand(x, z) { return groundH(x, z) > WATER_Y + 0.15; }
function shoreDist(x, z) { return islandR(Math.atan2(z, x)) - hyp(x, z); }

const W = {
  boxes: [],        // static solid boxes {x0,y0,z0,x1,y1,z1,mat}
  props: [],        // destructible props
  houses: [], roads: [], chests: [], ammo: [], loot: [], hills: [], helis: [], decor: [], fields: [], pads: [],
  grid: new Map(), GC: 16,
};
function gkey(ix, iz) { return ix * 4096 + iz; }
function gridAdd(o) {
  const G = W.GC;
  for (let ix = Math.floor(o.x0 / G); ix <= Math.floor(o.x1 / G); ix++)
    for (let iz = Math.floor(o.z0 / G); iz <= Math.floor(o.z1 / G); iz++) {
      const k = gkey(ix, iz); let c = W.grid.get(k); if (!c) W.grid.set(k, c = []); c.push(o);
    }
}
function gridRemove(o) {
  const G = W.GC;
  for (let ix = Math.floor(o.x0 / G); ix <= Math.floor(o.x1 / G); ix++)
    for (let iz = Math.floor(o.z0 / G); iz <= Math.floor(o.z1 / G); iz++) {
      const c = W.grid.get(gkey(ix, iz)); if (c) { const i = c.indexOf(o); if (i >= 0) c.splice(i, 1); }
    }
}
let _qid = 0;
function gridQuery(x0, z0, x1, z1, out) {
  const G = W.GC; _qid++; out.length = 0;
  for (let ix = Math.floor(x0 / G); ix <= Math.floor(x1 / G); ix++)
    for (let iz = Math.floor(z0 / G); iz <= Math.floor(z1 / G); iz++) {
      const c = W.grid.get(gkey(ix, iz)); if (!c) continue;
      for (const o of c) if (o._q !== _qid) { o._q = _qid; out.push(o); }
    }
  return out;
}
function addBox(x0, y0, z0, x1, y1, z1, extra) {
  const b = Object.assign({ x0: Math.min(x0, x1), y0, z0: Math.min(z0, z1), x1: Math.max(x0, x1), y1, z1: Math.max(z0, z1), kind: 'box' }, extra || {});
  W.boxes.push(b); gridAdd(b); return b;
}

// ---------------------------------------------------------------- terrain
function buildTerrain() {
  const rng = new RNG(4401), n1 = makeNoise(11), n2 = makeNoise(29);
  // hills placed away from towns, lake, river
  while (W.hills.length < 70) {
    const a = rng.range(0, TAU), d = Math.sqrt(rng.next()) * 560, x = Math.cos(a) * d, z = Math.sin(a) * d;
    const r = rng.range(28, 75), h = rng.range(5, 18) * (r / 55);
    if (shoreDist(x, z) < r + 25) continue;
    if (POIS.some(p => hyp(p.x - x, p.z - z) < p.r + r + 25)) continue;
    if (hyp((x - LAKE.x) / 1.3, z - LAKE.z) < LAKE.rx + r + 15) continue;
    let bad = false;
    for (let i = 0; i < RIVER.length - 1; i++) if (segDist(x, z, RIVER[i][0], RIVER[i][1], RIVER[i + 1][0], RIVER[i + 1][1]) < r + 18) bad = true;
    if (bad) continue;
    // keep hills off the roads - roads run through the valleys
    for (const rd of W.roads) for (let i = 0; i < rd.length - 1; i++) if (segDist(x, z, rd[i][0], rd[i][1], rd[i + 1][0], rd[i + 1][1]) < r + 14) bad = true;
    if (bad) continue;
    W.hills.push({ x, z, r, h });
  }
  for (let iz = 0; iz < HN; iz++) for (let ix = 0; ix < HN; ix++) {
    const x = ix * HC - HE, z = iz * HC - HE;
    const sd = shoreDist(x, z);
    let h;
    if (sd < 0) h = Math.max(-9, -1.2 + sd * 0.12);
    else if (sd < 28) h = lerp(-1.2, 1.6, smooth(sd / 28));
    else h = 1.6 + (n1(x / 90, z / 90) - 0.5) * 2.2 + (n2(x / 23, z / 23) - 0.5) * 0.5;
    // towns are flat
    for (const p of POIS) {
      const d = hyp(p.x - x, p.z - z);
      if (d < p.r + 30) h = lerp(1.6, h, smooth(clamp((d - p.r) / 30, 0, 1)));
    }
    for (const hl of W.hills) {
      const d = hyp(hl.x - x, hl.z - z) / hl.r;
      if (d < 1) h += hl.h * (0.5 + 0.5 * Math.cos(d * Math.PI));
    }
    // lake
    const ld = hyp((x - LAKE.x) / LAKE.rx, (z - LAKE.z) / LAKE.rz);
    if (ld < 1.6) h = lerp(-2.2, h, smooth(clamp((ld - 0.85) / 0.75, 0, 1)));
    HGT[iz * HN + ix] = h;
  }
}
// level the ground under every road: a smooth, gently sloping bed with soft shoulders
function gradeRoads() {
  for (const rd of W.roads) {
    // sample the road every 2 m and smooth the heights along it
    const pts = [];
    for (let i = 0; i < rd.length - 1; i++) {
      const [ax, az] = rd[i], [bx, bz] = rd[i + 1], L = hyp(bx - ax, bz - az), n = Math.max(1, Math.round(L / 2));
      for (let k = (i ? 1 : 0); k <= n; k++) { const t = k / n, x = lerp(ax, bx, t), z = lerp(az, bz, t); pts.push({ x, z, h: Math.max(groundH(x, z), WATER_Y + 0.6) }); }
    }
    const W2 = 10, sm = pts.map((p, i) => { let s = 0, c = 0; for (let j = Math.max(0, i - W2); j <= Math.min(pts.length - 1, i + W2); j++) { s += pts[j].h; c++; } return s / c; });
    // spread over the grid cells near the road
    let x0 = 1e9, z0 = 1e9, x1 = -1e9, z1 = -1e9; for (const p of pts) { x0 = Math.min(x0, p.x); x1 = Math.max(x1, p.x); z0 = Math.min(z0, p.z); z1 = Math.max(z1, p.z); }
    const R = 13, FLAT = 4.8;
    for (let iz = Math.max(0, Math.floor((z0 - R + HE) / HC)); iz <= Math.min(HN - 1, Math.ceil((z1 + R + HE) / HC)); iz++)
      for (let ix = Math.max(0, Math.floor((x0 - R + HE) / HC)); ix <= Math.min(HN - 1, Math.ceil((x1 + R + HE) / HC)); ix++) {
        const x = ix * HC - HE, z = iz * HC - HE;
        let bd = 1e9, bh = 0; for (let k = 0; k < pts.length; k++) { const d = (pts[k].x - x) ** 2 + (pts[k].z - z) ** 2; if (d < bd) { bd = d; bh = sm[k]; } }
        bd = Math.sqrt(bd); if (bd > R) continue;
        const i = iz * HN + ix, k = bd <= FLAT ? 1 : smooth(1 - (bd - FLAT) / (R - FLAT));
        HGT[i] = lerp(HGT[i], bh, k);
      }
  }
}
function carveRiver() {
  for (let iz = 0; iz < HN; iz++) for (let ix = 0; ix < HN; ix++) {
    const x = ix * HC - HE, z = iz * HC - HE;
    let d = 1e9;
    for (let i = 0; i < RIVER.length - 1; i++) d = Math.min(d, segDist(x, z, RIVER[i][0], RIVER[i][1], RIVER[i + 1][0], RIVER[i + 1][1]));
    if (d > RIVER_HALF + 10) continue;
    // keep a land bridge where a road crosses
    let road = 1e9;
    for (const r of W.roads) for (let i = 0; i < r.length - 1; i++) road = Math.min(road, segDist(x, z, r[i][0], r[i][1], r[i + 1][0], r[i + 1][1]));
    if (road < 6) continue;
    const k = smooth(clamp((d - RIVER_HALF) / 10, 0, 1));
    const i = iz * HN + ix;
    HGT[i] = lerp(-1.6, HGT[i], k);
  }
}
function flatten(x0, z0, x1, z1, h) {
  for (let iz = Math.max(0, Math.floor((z0 + HE) / HC)); iz <= Math.min(HN - 1, Math.ceil((z1 + HE) / HC)); iz++)
    for (let ix = Math.max(0, Math.floor((x0 + HE) / HC)); ix <= Math.min(HN - 1, Math.ceil((x1 + HE) / HC)); ix++)
      HGT[iz * HN + ix] = h;
}

// ---------------------------------------------------------------- buildings
// a house is a hollow box with a door gap; walls go into collision
function house(x, z, w, d, door, wall, roof, h, opt) {
  opt = opt || {};
  h = h || 3.4;

  beginMatch({ seed, mode, party: [{ name: App.save.name, outfit: App.save.outfit, pickaxe: App.save.pickaxe, glider: App.save.glider, contrail: App.save.contrail }], meIndex: 0, net: null });

  if (TOUCH.on) { Input.locked = !!on; if (App.state === 'match') setTimeout(matchUI, 0); return; }   // phones: no mouse to lock
  if (on) { try { const p = c.requestPointerLock && c.requestPointerLock(); if (p && p.catch) p.catch(() => { }); } catch (e) { } }
  else if (document.pointerLockElement) { try { document.exitPointerLock(); } catch (e) { } }
}
function initInput() {
  const c = document.getElementById('gl');
  document.addEventListener('pointerlockchange', () => { Input.locked = document.pointerLockElement === c; if (App.state === 'match') { if (!Input.locked && G && G.me.alive && !G.over && !G.showMap && !G.invOpen && !G.emoteOpen && !App.paused) App.paused = true; matchUI(); } });
  c.addEventListener('mousedown', e => {
    initAudio();
    if (App.state === 'match' && G && G.showMap) { mapClick(e); return; }
    if (App.state === 'match' && !Input.locked && !App.paused) { setPointerLock(true); return; }
    Input.mb[e.button] = true; if (e.button === 2) Input.pressed.add('Mouse2');
    Input.keys.add('Mouse' + e.button); Input.pressed.add('Mouse' + e.button);
  });
  window.addEventListener('mouseup', e => { Input.mb[e.button] = false; Input.keys.delete('Mouse' + e.button); });
  c.addEventListener('auxclick', e => e.preventDefault());
  c.addEventListener('contextmenu', e => e.preventDefault());
  window.addEventListener('mousemove', e => { if (Input.locked) { Input.dx += e.movementX; Input.dy += e.movementY; } else if (App.state === 'match' && Input.mb[0] && !App.paused) { Input.dx += e.movementX; Input.dy += e.movementY; } });
  c.addEventListener('wheel', e => { if (App.state === 'match') { Input.wheel += Math.sign(e.deltaY); e.preventDefault(); } }, { passive: false });
  window.addEventListener('keydown', e => {
    if (e.target && e.target.tagName === 'INPUT') return;
    if (App.state !== 'match') return;
    if (App.modal) return;
    if (['Space', 'Tab', 'Backspace', 'ArrowUp', 'ArrowDown'].includes(e.code) || Object.values(BINDS).includes(e.code)) e.preventDefault();
    if (e.code === 'Escape' || e.code === 'KeyP') {
      if (G && G.showMap) { toggleMap(false); return; }
      if (G && G.invOpen) { toggleInventory(false); return; }
      if (G && G.emoteOpen) { toggleEmotes(false); return; }
      if (G && G.me.alive) { App.paused = !App.paused; matchUI(); if (!App.paused) setPointerLock(true); }
      return;
    }
    if (e.code === BINDS.map && G) { toggleMap(); return; }
    if (e.code === BINDS.inv && G && !e.repeat) { toggleInventory(); return; }
    if (e.code === BINDS.emote && G && App.state === 'match' && !e.repeat) { toggleEmotes(); return; }
    if (G && G.emoteOpen && /^Digit[1-9]$/.test(e.code)) { const list = EMOTES.filter(ownsEmote), em = list[+e.code.slice(5) - 1]; if (em) { playEmote(G.me, em.id); toggleEmotes(false); } return; }

  document.addEventListener('visibilitychange', () => { if (document.hidden && TOUCH.on && App.state === 'match' && G && G.me.alive && !G.over && !App.paused) { App.paused = true; Input.keys.clear(); Input.mb = [false, false, false]; Input.joy = null; matchUI(); } });
  // the first touch anywhere unlocks sound on phones
  window.addEventListener('touchend', () => initAudio(), { once: true });
}

// ---------------------------------------------------------------- key binds screen
function keybindsMenu() {
  App.modal = true;
  const el = $(`<div class="center"><div class="menu" style="width:min(620px,100%);max-height:94vh;overflow:auto"><h2>KEY BINDS</h2>
    <div class="note">Click a control, then press the key you want (mouse side buttons work too). Esc cancels.</div>
    <div class="binds"></div>
    <div class="note">Shoot stays on left click. Esc always opens the menu.</div>
    <div class="row"><button id="kbreset">RESET TO DEFAULT</button><button class="primary" id="kbdone" style="flex:1">DONE</button></div></div></div>`);
  const list = el.querySelector('.binds');
  let waiting = null;
  const stop = () => { window.removeEventListener('keydown', onKey, true); window.removeEventListener('mousedown', onMouse, true); };
  const draw = () => {
    list.innerHTML = '';
    for (const [k, label] of BIND_DEFS) {
      const b = $(`<button class="bind ${waiting === k ? 'on' : ''}"><span>${esc(label)}</span><b>${waiting === k ? 'PRESS A KEY...' : esc(keyLabel(BINDS[k]))}</b></button>`);
      b.onclick = e => { e.stopPropagation(); waiting = k; draw(); };
      list.appendChild(b);
    }
  };
  const setBind = code => {
    const k = waiting; waiting = null;
    const other = Object.keys(BINDS).find(o => o !== k && BINDS[o] === code);
    if (other) BINDS[other] = BINDS[k];            // swap so nothing ends up with no key
    BINDS[k] = code;
    App.save.binds = Object.assign({}, BINDS); writeSave(); sfx('click', .4); draw();
  };
  const onKey = e => {
    if (!waiting) return;
    e.preventDefault(); e.stopPropagation();
    if (e.code === 'Escape') { waiting = null; draw(); return; }
    if (e.code === 'KeyP') { uiToast('P IS SAVED FOR THE MENU'); return; }
    setBind(e.code);
  };
  const onMouse = e => {
    if (!waiting || e.button === 0) return;   // left click is always shoot
    e.preventDefault(); e.stopPropagation(); setBind('Mouse' + e.button);
  };
  window.addEventListener('keydown', onKey, true); window.addEventListener('mousedown', onMouse, true);
  el.querySelector('#kbreset').onclick = () => { App.save.binds = {}; loadBinds(); writeSave(); waiting = null; draw(); };
  el.querySelector('#kbdone').onclick = () => { stop(); App.modal = false; if (App.state === 'match') matchUI(); else renderLobby(); };
  draw(); setUI(el);
}

const b64u = { enc: u8 => { let s = ''; for (let i = 0; i < u8.length; i += 0x8000) s += String.fromCharCode.apply(null, u8.subarray(i, i + 0x8000)); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); },

const QUEST_POOL = [
  { id: 'elims', text: 'Eliminate 3 opponents', goal: 3, xp: 600, coins: 60 },
  { id: 'chests', text: 'Search 5 chests', goal: 5, xp: 500, coins: 50 },
  { id: 'dmg', text: 'Deal 600 damage', goal: 600, xp: 600, coins: 60 },
  { id: 'builds', text: 'Place 40 builds', goal: 40, xp: 400, coins: 40 },
  { id: 'matches', text: 'Play 3 matches', goal: 3, xp: 500, coins: 50 },
  { id: 'top10', text: 'Finish in the top 10', goal: 1, xp: 700, coins: 70 },
  { id: 'heals', text: 'Use 4 healing items', goal: 4, xp: 400, coins: 40 },
  { id: 'moves', text: 'Use 3 movement items', goal: 3, xp: 500, coins: 50 },
  { id: 'harvest', text: 'Harvest 300 materials', goal: 300, xp: 400, coins: 40 },
  { id: 'outlast', text: 'Outlast 60 players in total', goal: 60, xp: 500, coins: 50 },

function ensureQuests() {
  const s = App.save, today = dayKey();
  if (s.quests && s.quests.day === today && s.quests.list.length) return;
  const pool = QUEST_POOL.slice(); const list = [];
  let seed = 0; for (const ch of today + (App.user || 'guest')) seed = (seed * 31 + ch.charCodeAt(0)) >>> 0;
  while (list.length < 3) { seed = (seed * 1103515245 + 12345) >>> 0; const q = pool.splice(seed % pool.length, 1)[0]; list.push({ id: q.id, have: 0, done: false }); }
  s.quests = { day: today, list };
}
function matchProgress(r) {
  const s = App.save; ensureQuests();
  const add = { elims: r.elims, chests: r.chests, dmg: r.dmg, builds: r.builds, matches: 1, top10: r.place <= 10 ? 1 : 0, heals: r.heals, moves: r.moves, harvest: r.harvest, outlast: Math.max(0, r.total - r.place) };
  const done = [];
  for (const q of s.quests.list) {
    if (q.done) continue;
    const Q = QUEST_POOL.find(x => x.id === q.id); if (!Q) continue;
    q.have = Math.min(Q.goal, q.have + (add[q.id] || 0));
    if (q.have >= Q.goal) { q.done = true; s.coins = (s.coins | 0) + Q.coins; s.xp += Q.xp; s.questsDone = (s.questsDone | 0) + 1; done.push(Q); }
  }
  if ((s.questsDone | 0) >= 10 && !s.owned.includes('QUESTER')) s.owned.push('QUESTER');
  const coins = 20 + r.elims * 10 + (r.place <= 10 ? 30 : 0) + (r.win ? 150 : 0);
  s.coins = (s.coins | 0) + coins;
  return { coins, done };
}

  const featured = [...pick(exOut, 2).map(i => ['OUTFITS', i]), ...pick(exOther, 1)];
  const coinOut = OUTFITS.filter(o => o.price).map(i => ['OUTFITS', i]);
  const coinOther = [...PICKAXES.filter(p => p.price).map(i => ['PICKAXES', i]), ...EMOTES.filter(e => e.price).map(i => ['EMOTES', i]), ...GLIDERS.filter(g => g.price).map(i => ['GLIDERS', i]), ...CONTRAILS.filter(t => t.price).map(i => ['TRAILS', i])];
  const daily = [...pick(coinOut, 3), ...pick(coinOther, 5)];

}

async function redeemCode(code) {

  const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode('agency:' + code));
  const h = [...new Uint8Array(buf)].map(x => x.toString(16).padStart(2, '0')).join('');
  const what = REDEEM[h];
  if (!what) return 'That code did not work.';
  if (!App.user) return 'Sign in to your account first, so the items are saved to it.';
  if (what === 'ALL') {
    for (const cat of COS_ORDER) for (const it of COS[cat].list) if (it.price || it.usd || it.tier || it.reward) grantItem(cat, it.id, false);
    App.save.unlockAll = true;

}
